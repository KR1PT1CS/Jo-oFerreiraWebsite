<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>João Ferreira — Games and art portfolio</title>
<link rel="icon" href="data:,">
<meta name="description" content="Portfolio of João Ferreira: games, 3D and concept art.">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Lochley';src:url('assets/fonts/lochley.otf') format('opentype');font-display:swap}
@font-face{font-family:'Dither Byte';src:url('assets/fonts/ditherbyte-regular.ttf') format('truetype');font-display:swap}
@font-face{font-family:'Pixelta';src:url('assets/fonts/pixelta.ttf') format('truetype');font-display:swap}
body{margin:0;background:#000000}
html{scroll-behavior:smooth}
a{color:#F2EEFA;text-decoration:none;transition:color .25s,text-shadow .25s}
a:hover{color:var(--accent)}
.glow{text-shadow:0 0 6px color-mix(in srgb,var(--glowc) calc(var(--gi) * 70%),transparent),0 0 22px color-mix(in srgb,var(--glowc) calc(var(--gi) * 40%),transparent)}
.name{font-family:'Lochley','Dither Byte','Pixelta',monospace;font-weight:400;color:#FFFFFF;text-shadow:0 0 10px rgba(255,255,255,calc(var(--gi) * .45)),0 0 34px color-mix(in srgb,var(--glowc) calc(var(--gi) * 55%),transparent)}
.lbl{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#C9BEDD}
.navlink{transition:opacity .25s,color .25s,background .25s,box-shadow .25s;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:0;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#F2EEFA;opacity:.85;transition:opacity .25s,color .25s,background .25s,box-shadow .25s}
.navlink:hover{opacity:1;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn{transition:border-color .3s,box-shadow .3s,color .3s}
.btn:hover{border-color:var(--accent) !important;box-shadow:0 0 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.tag{transition:border-color .3s,box-shadow .3s}
.tag:hover{border-color:var(--accent);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.row{all:unset;position:relative;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:24px;align-items:center;padding:30px 0;border-top:1px solid rgba(242,238,250,.14);transition:padding .45s cubic-bezier(.2,.7,.2,1)}
.row:hover{padding-left:14px}
.row > span{position:relative;z-index:1}
.detail > div{position:relative;z-index:1}
.artfx{position:absolute;top:0;left:50%;width:100vw;height:100%;transform:translateX(-50%);opacity:.42;pointer-events:none;z-index:0;image-rendering:pixelated}
.ic{display:block;flex:none;width:16px;height:16px;background-color:currentColor;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.ic-unity{-webkit-mask-image:url('assets/icons/unity.png');mask-image:url('assets/icons/unity.png')}
.ic-blender{-webkit-mask-image:url('assets/icons/blender.png');mask-image:url('assets/icons/blender.png')}
.ic-maya{-webkit-mask-image:url('assets/icons/maya.png');mask-image:url('assets/icons/maya.png')}
.ic-painter{-webkit-mask-image:url('assets/icons/painter.png');mask-image:url('assets/icons/painter.png')}
.ic-photoshop{-webkit-mask-image:url('assets/icons/photoshop.png');mask-image:url('assets/icons/photoshop.png')}
.ic-premiere{-webkit-mask-image:url('assets/icons/premiere.png');mask-image:url('assets/icons/premiere.png')}
.ic-aftereffects{-webkit-mask-image:url('assets/icons/aftereffects.png');mask-image:url('assets/icons/aftereffects.png')}
.ic-reaper{-webkit-mask-image:url('assets/icons/reaper-glyph.png');mask-image:url('assets/icons/reaper-glyph.png')}
.ic-itch{-webkit-mask-image:url('assets/icons/itch.png');mask-image:url('assets/icons/itch.png')}
.ic-artstation{-webkit-mask-image:url('assets/icons/artstation.png');mask-image:url('assets/icons/artstation.png')}
.ic-cv{-webkit-mask-image:url('assets/icons/cv.png');mask-image:url('assets/icons/cv.png')}
.artfx.swirlfx{opacity:.4}
.artfx.tunnelfx{opacity:.26}
.navfx{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:60;pointer-events:none;image-rendering:pixelated}
#art > div,#art > a,#about > h2,#about > div,#contact > h2,#contact > a,#contact > div{position:relative;z-index:1}
.flame.dflame{left:50%;right:auto;width:100vw;transform:translateX(-50%);opacity:.15}
.detail .ph{background-color:rgba(10,7,16,.45)}
.flame{position:absolute;top:0;right:0;bottom:0;width:62%;height:100%;z-index:0;pointer-events:none;image-rendering:pixelated}
.row:hover .rt{color:var(--accent)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
.rt{font-size:clamp(26px,3.2vw,42px);line-height:1.1;transition:color .3s}
.plus{display:flex;justify-content:flex-end;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.row[aria-expanded="true"] .plus{transform:rotate(45deg);color:var(--accent)}
.detail{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ph{box-sizing:border-box;display:flex;align-items:flex-end;padding:16px;background-color:#0A0710;background-image:radial-gradient(rgba(180,140,255,.22) 1px,transparent 1.3px);background-size:6px 6px;border:1px solid rgba(180,140,255,.14);transition:border-color .35s,box-shadow .35s}
.tile{display:flex;flex-direction:column;gap:14px;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.tile:hover{transform:translateY(-6px)}
.tile:hover .ph{border-color:var(--accent);box-shadow:0 0 28px color-mix(in srgb,var(--accent) 25%,transparent)}
.chip{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1px solid rgba(242,238,250,.24);border-radius:0;font-family:'Pixelta','Geist Mono',monospace;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#F2EEFA;transition:background .3s,color .3s,border-color .3s,box-shadow .3s}
.chip:hover{border-color:var(--accent);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 30%,transparent)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.chip.on{background:#F2EEFA;color:#000000;border-color:#F2EEFA;text-shadow:none}
.tag{display:inline-flex;background:color-mix(in srgb,var(--bg) 72%,transparent);padding:6px 11px;border:1px solid rgba(180,140,255,.26);border-radius:0;font-size:13px;letter-spacing:.04em;color:#DCD3EC}
.dot{width:8px;height:8px;border-radius:0;background:var(--accent);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.biglink{font-size:clamp(32px,5.4vw,80px);line-height:1.05;word-break:break-word}
.reveal{position:relative;opacity:0;transform:translateY(16px);transition:opacity 1.8s cubic-bezier(.25,.6,.25,1),transform 2.2s cubic-bezier(.25,.6,.25,1)}
.dmask{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:3;image-rendering:pixelated}
.reveal.in{opacity:1;transform:none}
.reveal .stag{opacity:0;transform:translateY(14px);transition:opacity 1.4s cubic-bezier(.25,.6,.25,1),transform 1.6s cubic-bezier(.25,.6,.25,1);transition-delay:var(--d,0s)}
.reveal.in .stag{opacity:1;transform:none}
@media (max-width:760px){
.row{grid-template-columns:36px minmax(0,1fr);gap:14px}
.rmeta{display:none !important}
}
.bob{display:inline-block;animation:bob 3.6s steps(5,end) infinite alternate;will-change:transform}
@keyframes bob{from{transform:translateY(5px)}to{transform:translateY(-7px)}}
.stroke{-webkit-text-stroke:10px #000000;paint-order:stroke fill}
.namecv{position:absolute;left:0;top:0;pointer-events:none;image-rendering:pixelated;filter:drop-shadow(0 0 8px rgba(255,255,255,.28)) drop-shadow(0 0 26px color-mix(in srgb,var(--glowc) 45%,transparent))}
.vidfx{position:absolute;left:0;top:0;pointer-events:none;z-index:2;image-rendering:pixelated}
.ph.vidglow{border:1px solid color-mix(in srgb,var(--accent) 85%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent),0 0 16px color-mix(in srgb,var(--accent) 55%,transparent),0 0 48px color-mix(in srgb,var(--glowc) 40%,transparent);animation:vidpulse 3.2s ease-in-out infinite}
@keyframes vidpulse{0%,100%{box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent),0 0 14px color-mix(in srgb,var(--accent) 45%,transparent),0 0 40px color-mix(in srgb,var(--glowc) 30%,transparent)}50%{box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 55%,transparent),0 0 22px color-mix(in srgb,var(--accent) 70%,transparent),0 0 64px color-mix(in srgb,var(--glowc) 50%,transparent)}}
.emailfx{position:absolute;left:0;top:0;pointer-events:none;z-index:2;image-rendering:pixelated}
.biglink{display:block;width:fit-content;transition:color .35s,text-shadow .35s}
.biglink:hover,.biglink:focus-visible{color:#FFFFFF;text-shadow:0 0 10px color-mix(in srgb,var(--accent) 90%,transparent),0 0 28px color-mix(in srgb,var(--accent) 70%,transparent),0 0 60px color-mix(in srgb,var(--glowc) 55%,transparent)}
.name-live{color:transparent !important;-webkit-text-stroke:0 !important;text-shadow:none !important}
.bobs{animation-name:bobs}
@keyframes bobs{from{transform:translateY(2px)}to{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){
.rm *{transition:none !important;animation:none !important}
.rm .reveal,.rm .reveal .stag{opacity:1 !important;transform:none !important}
.rm .dmask{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="{{rootCls}}" style="width: 100%; min-height: 100vh; background: {{bg}}; --accent: {{accent}}; --bg: {{bg}}; --glowc: {{glowColor}}; --gi: {{glowAmt}}; color: #F2EEFA; font-family: 'Pixelta', 'Geist Mono', monospace; -webkit-font-smoothing: antialiased; overflow-x: hidden">

<canvas class="navfx" ref="{{setNavFx}}" aria-hidden="true"></canvas>
<audio ref="{{setAudio}}" src="assets/audio/iudicium.mp4" loop="loop" preload="auto"></audio>
<button class="chip sound" onClick="{{toggleMusic}}" aria-pressed="{{musicPressed}}" aria-label="Background music" style="position: fixed; right: 20px; bottom: 20px; z-index: 55; gap: 10px; background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px)">
<sc-if value="{{musicOn}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 8 8" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true" style="flex: none"><rect x="0" y="3" width="2" height="2"></rect><rect x="2" y="2" width="1" height="4"></rect><rect x="3" y="1" width="1" height="6"></rect><rect x="5" y="2" width="1" height="1"></rect><rect x="5" y="5" width="1" height="1"></rect><rect x="6" y="3" width="1" height="2"></rect><rect x="7" y="1" width="1" height="1"></rect><rect x="7" y="6" width="1" height="1"></rect></svg></sc-if>
<sc-if value="{{musicOff}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 8 8" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true" style="flex: none"><rect x="0" y="3" width="2" height="2"></rect><rect x="2" y="2" width="1" height="4"></rect><rect x="3" y="1" width="1" height="6"></rect><rect x="5" y="2" width="1" height="1"></rect><rect x="7" y="2" width="1" height="1"></rect><rect x="6" y="3" width="1" height="2"></rect><rect x="5" y="5" width="1" height="1"></rect><rect x="7" y="5" width="1" height="1"></rect></svg></sc-if>
<span>{{musicLabel}}</span>
</button>

<header onMouseMove="{{onMove}}" onMouseLeave="{{onLeave}}" style="position: relative; height: 900px; overflow: hidden">
<canvas ref="{{setCanvas}}" aria-hidden="true" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated"></canvas>
<canvas ref="{{setCurFx}}" aria-hidden="true" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; pointer-events: none; image-rendering: pixelated"></canvas>

<nav aria-label="Main" style="position: absolute; top: 24px; left: 0; right: 0; z-index: 2; padding: 0 clamp(20px, 4vw, 56px); display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; align-items: center">
<div style="display: flex; flex-wrap: wrap; gap: 2px; padding: 0 6px; border-radius: 0; background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px)">
<a href="#games" class="navlink" onClick="{{navGames}}">Games</a>
<a href="#art" class="navlink" onClick="{{navArt}}">Art</a>
<a href="#about" class="navlink" onClick="{{navAbout}}">About</a>
<a href="#contact" class="navlink" onClick="{{navContact}}">Contact</a>
</div>
</nav>

<div id="top" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding: 0 clamp(20px, 4vw, 56px) 64px; display: flex; flex-direction: column; gap: 28px; pointer-events: none">
<h1 class="name stroke name-live" ref="{{setNameEl}}" style="margin: 0; font-family: 'Dither Byte', 'Pixelta', monospace; font-size: clamp(54px, 9.5vw, 150px); line-height: .92"><span class="bob" style="position: relative">João<br>Ferreira<canvas class="namecv" ref="{{setNameCv}}" aria-hidden="true"></canvas></span></h1>
<div style="display: flex; flex-wrap: wrap; gap: 24px 64px; align-items: flex-end; justify-content: space-between">
<p style="margin: 0; max-width: 780px; font-size: clamp(18px, 1.75vw, 24px); line-height: 1.55; color: #EDE7F7">Currently a 3rd year Videogame student at Universidade Lusofona. I work with a variety of art software since my main areas are 3D modelling, concept art and graphic design, such as Photoshop, Blender, Maya and Substance Painter. My main game software is Unity, and I also dabble with sound and video software such as Premiere Pro, After Effects and Reaper. I tend to lean on survival horror and first person shooter genres, and I try new art styles with each project release.</p>
<p class="lbl" style="margin: 0">Lisbon, PT / Games and Art / 2026</p>
</div>
</div>
</header>

<main style="max-width: 1320px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 56px)">

<section id="games" ref="{{refGames}}" class="{{clsGames}}" aria-labelledby="t-games" style="padding: 120px 0 40px">
<canvas class="dmask" ref="{{maskGames}}" aria-hidden="true"></canvas>
<div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: baseline; margin-bottom: 40px">
<h2 id="t-games" class="bob bobs" style="animation-delay: -0.9s; margin: 0; font-family: 'Lochley', 'Dither Byte', 'Pixelta', monospace; color: #FFFFFF; font-size: clamp(56px, 8vw, 128px); font-weight: 400; line-height: 1; letter-spacing: .01em; text-transform: uppercase">Games<span style="font-family: 'Pixelta', 'Geist Mono', monospace; font-size: clamp(16px, 1.7vw, 24px); text-transform: none; letter-spacing: .02em; color: #EDE7F7; margin-left: .7em; vertical-align: middle; white-space: nowrap">- The projects I felt most accomplished with</span></h2>
<p class="lbl" style="margin: 0">{{projCount}} projects / click to open</p>
</div>

<div>
<sc-for list="{{projects}}" as="p" hint-placeholder-count="6">
<div class="stag" style="--d: {{p.delay}}">
<button class="row" onClick="{{p.toggle}}" onMouseEnter="{{p.enter}}" onMouseLeave="{{p.leave}}" onFocus="{{p.enter}}" onBlur="{{p.leave}}" aria-expanded="{{p.ariaExp}}">
<canvas class="flame" ref="{{p.flameRef}}" aria-hidden="true"></canvas>
<span style="font-size: 15px; color: #C9BEDD">{{p.num}}</span>
<span style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
<span class="rt">{{p.title}}</span>
<span class="lbl" style="font-size: 13px">{{p.kind}}</span>
</span>
<span class="rmeta" style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 380px">
<sc-for list="{{p.tags}}" as="t" hint-placeholder-count="3">
<span class="tag">{{t}}</span>
</sc-for>
<span class="tag" style="color: #FFFFFF">{{p.year}}</span>
</span>
</button>
<sc-if value="{{p.open}}" hint-placeholder-val="{{ false }}">
<div class="detail" style="position: relative; display: flex; flex-wrap: wrap; gap: 40px; padding: 8px 0 56px">
<canvas class="artfx" ref="{{p.detailFxRef}}" aria-hidden="true"></canvas>
<sc-if value="{{p.hasVideo}}" hint-placeholder-val="{{ false }}"><canvas class="vidfx" ref="{{vidFxRef}}" aria-hidden="true"></canvas></sc-if>
<div class="{{p.phCls}}" style="position: relative; overflow: hidden; flex: 1 1 520px; aspect-ratio: 16 / 9; min-width: 0">
<sc-if value="{{p.hasVideo}}" hint-placeholder-val="{{ false }}">
<video ref="{{videoRef}}" src="{{p.video}}" poster="{{p.poster}}" autoplay="autoplay" muted="muted" loop="loop" playsinline="playsinline" preload="auto" aria-label="{{p.mediaLabel}}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block; background: #000000"></video>
</sc-if>
<sc-if value="{{p.noVideo}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 14px; color: #DCD3EC">{{p.media}}</span>
</sc-if>
</div>
<div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 22px; padding-top: 4px">
<p style="margin: 0; font-size: 18px; line-height: 1.65; color: #EDE7F7">{{p.desc}}</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; padding-top: 18px; border-top: 1px solid rgba(242,238,250,.14)">
<div style="display: flex; flex-direction: column; gap: 6px">
<span class="lbl" style="font-size: 13px">My role</span>
<span style="font-size: 16px; white-space: pre-line; line-height: 1.6">{{p.role}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span class="lbl" style="font-size: 13px">Status</span>
<span style="font-size: 16px">{{p.status}}</span>
</div>
</div>
<a href="{{p.href}}" class="btn" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 20px; border-radius: 0; border: 1px solid rgba(242,238,250,.26); font-size: 14px; letter-spacing: .06em; text-transform: uppercase">{{p.linkLabel}} ↗</a>
</div>
</div>
</sc-if>
</div>
</sc-for>
<div style="border-top: 1px solid rgba(242,238,250,.14)"></div>
</div>
</section>

<section id="art" ref="{{refArt}}" class="{{clsArt}}" aria-labelledby="t-art" style="padding: 120px 0 40px">
<canvas class="dmask" ref="{{maskArt}}" aria-hidden="true"></canvas>
<canvas class="artfx" ref="{{setArtFx}}" aria-hidden="true"></canvas>
<div style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; align-items: center; margin-bottom: 44px">
<h2 id="t-art" class="bob bobs" style="animation-delay: -1.8s; margin: 0; font-family: 'Lochley', 'Dither Byte', 'Pixelta', monospace; color: #FFFFFF; font-size: clamp(56px, 8vw, 128px); font-weight: 400; line-height: 1; letter-spacing: .01em; text-transform: uppercase">Art<span style="font-family: 'Pixelta', 'Geist Mono', monospace; font-size: clamp(16px, 1.7vw, 24px); text-transform: none; letter-spacing: .02em; color: #EDE7F7; margin-left: .7em; vertical-align: middle; white-space: nowrap">- A display of my range</span></h2>
<div role="group" aria-label="Filter art" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button class="{{f.cls}}" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}">{{f.label}}</button>
</sc-for>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 40px 28px">
<sc-for list="{{art}}" as="a" hint-placeholder-count="6">
<a href="{{a.href}}" class="tile stag" style="--d: {{a.delay}}">
<div class="ph" style="aspect-ratio: 4 / 5; width: 100%">
<span style="font-size: 14px; color: #DCD3EC">{{a.ph}}</span>
</div>
<div style="display: flex; justify-content: space-between; gap: 12px; align-items: baseline">
<span style="font-size: 18px">{{a.title}}</span>
<span class="lbl" style="font-size: 12px; white-space: nowrap">{{a.cat}}</span>
</div>
<span style="font-size: 15px; color: #C9BEDD; margin-top: -8px">{{a.meta}}</span>
</a>
</sc-for>
</div>
<a href="https://www.artstation.com/kr1pt1cs" style="display: inline-flex; align-items: center; min-height: 44px; margin-top: 40px; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; border-bottom: 1px solid rgba(242,238,250,.35)">See everything on ArtStation ↗</a>
</section>

<section id="about" ref="{{refAbout}}" class="{{clsAbout}}" aria-labelledby="t-about" style="padding: 120px 0 40px">
<canvas class="dmask" ref="{{maskAbout}}" aria-hidden="true"></canvas>
<canvas class="artfx tunnelfx" ref="{{setAboutFx}}" aria-hidden="true"></canvas>

  hex(h) {

  startArtFx() {

        const W = cv.clientWidth, H = cv.clientHeight;
        if (!W || !H) return;
        if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
        const ctx = cv.getContext('2d');
        ctx.clearRect(0, 0, W, H);
        const P = this.props;
        const bg = P.corFundo ?? '#000000', dith = P.corDither ?? '#4B3161', lite = P.corCursor ?? '#A57FD0', acc2 = P.corDestaque ?? '#B48CFF';
        const pal = [mixHex(bg, dith, 0.3), mixHex(bg, dith, 0.5), mixHex(bg, dith, 0.72), dith, mixHex(dith, lite, 0.18)];

        const vert = sides[0] === 'b';
        const cutV = Math.ceil(rows * 0.92);
        const outer = vert ? cols : rows;
        for (let r0 = 0; r0 < outer; r0++) {
          for (const side of sides) {
            const lim2 = vert ? cutV : cut;
            for (let ec = 0; ec < lim2; ec++) {
              const c = vert ? r0 : (side ? cols - 1 - ec : ec);
              const r = vert ? rows - 1 - ec : r0;

        for (let k = 0; k < spawn && parts.length < 260; k++) {
          const side = sides[Math.floor(Math.random() * sides.length)];
          if (vert) { parts.push({ side: 'b', x: Math.random() * H * 0.3, y: Math.random() * W, vx: 18 + Math.random() * 55, vy: (Math.random() - 0.5) * 10, life: 0, max: 2.2 + Math.random() * 3.4, ci: 1 + Math.floor(Math.random() * 5) }); continue; }
          parts.push({ side: side, x: Math.random() * W * 0.3, y: Math.random() * H, vx: 18 + Math.random() * 55, vy: (Math.random() - 0.5) * 10, life: 0, max: 2.2 + Math.random() * 3.4, ci: 1 + Math.floor(Math.random() * 5) });

        }
        pp2.forEach((p3) => { ctx.fillStyle = p3[0]; ctx.fill(p3[1]); });
    };

    const drawTunnel = (cv) => {
      if (!cv || !cv.getContext) return;
      const rc = cv.getBoundingClientRect();
      if (rc.bottom < 0 || rc.top > (window.innerHeight || 900)) return;
      const W = cv.clientWidth, H = cv.clientHeight;
      if (!W || !H) return;
      if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
      const ctx = cv.getContext('2d');
      ctx.clearRect(0, 0, W, H);
      const P = this.props;
      const bg = P.corFundo ?? '#000000', dith = P.corDither ?? '#4B3161', lite = P.corCursor ?? '#A57FD0', acc = P.corDestaque ?? '#B48CFF';
      const pal = [mixHex(bg, dith, 0.4), mixHex(bg, dith, 0.75), dith, mixHex(dith, lite, 0.45), lite, mixHex(lite, acc, 0.5)];
      const cell = Math.max(4, Math.round(Number(P.tamanhoPixel ?? 3) * 2));
      const cols = Math.ceil(W / cell), rows = Math.ceil(H / cell);
      const R0 = Math.max(W * 0.55, H);
      // the ship steers: the vanishing point wanders and the far end of the tunnel bends with it
      const tx = Math.sin(t * 0.33) * 0.6 + Math.sin(t * 0.11 + 2.1) * 0.4;
      const ty = Math.sin(t * 0.23 + 1.3) * 0.6 + Math.sin(t * 0.07) * 0.4;
      const cx = W * 0.74 + tx * W * 0.05, cy = H * 0.6 + ty * H * 0.08;

        const py0 = (r + 0.5) * cell - cy;
        for (let c = 0; c < cols; c++) {

          const ring = 0.5 + 0.5 * Math.sin(z * 1.4 - t * 12);

        }
      }
      this.gridFlush(g, ctx, cell);
    };

    const drawSwirl = (cv, step) => {
      if (!cv || !cv.getContext) return;
      const rc = cv.getBoundingClientRect();
      if (rc.bottom < 0 || rc.top > (window.innerHeight || 900)) return;
      const W = cv.clientWidth, H = cv.clientHeight;
      if (!W || !H) return;
      if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
      const ctx = cv.getContext('2d');
      ctx.clearRect(0, 0, W, H);
      const P = this.props;
      const bg = P.corFundo ?? '#000000', dith = P.corDither ?? '#4B3161', lite = P.corCursor ?? '#A57FD0';
      const pal = [mixHex(bg, dith, 0.35), mixHex(bg, dith, 0.6), dith, mixHex(dith, lite, 0.3), mixHex(dith, lite, 0.6)];

        const q = swirlParts[k];
        q.life += step; q.x += q.vx * step; q.y += q.vy * step;
        const lr = q.life / q.max;
        if (lr >= 1 || q.x < 0 || q.y < 0 || q.x > W || q.y > H) { swirlParts.splice(k, 1); continue; }

      sp.forEach((pp, i) => { ctx.fillStyle = pal[i]; ctx.fill(pp); });
    };

    const frame = (now) => {

  }

  armHover() {
    let cur = null;
    const over = (e) => {
      const el = e.target && e.target.closest ? e.target.closest('a, button, .tag, .tile') : null;
      if (el === cur) return;

      if (el) this.sfx('hover');

    this.offHover = () => window.removeEventListener('pointerover', over, true);
  }

  armSound() {
    const go = (e) => {
      if (e && e.target && e.target.closest && e.target.closest('.sound')) { this.ensureAudioCtx(); return; }
      this.ensureAudioCtx();
      if (this.state.music && this.audio && this.audio.paused) this.startMusic();
      if (this.audio && !this.audio.paused) off();
    };
    const evs = ['pointerdown', 'mousedown', 'keydown', 'touchstart', 'click'];
    const off = () => evs.forEach((ev) => window.removeEventListener(ev, go, true));
    evs.forEach((ev) => window.addEventListener(ev, go, true));
    this.offSound = off;
    if (this.state.music && this.audio) {
      const a = this.audio; a.volume = 0;
      const pr = a.play();
      if (pr && pr.then) pr.then(() => { this.fadeVol(Math.max(0, Math.min(1, Number(this.props.volumeMusica ?? 0.12))), 450); }).catch(() => {});

  startNameFx() {

    // so every font pixel - including its dither holes - becomes one particle.

    let n = 0, hx, hy, x, y, vx, vy, col, W = 0, H = 0, buf = null, img = null, ctx = null;
    let u = 3, sc = 1, M = 0, MX = 0;

        try { await document.fonts.ready; } catch (e) {}

        cv.width = W; cv.height = H;
        cv.style.left = (-MX * sc) + 'px'; cv.style.top = (-M * sc) + 'px';
        cv.style.width = (W * sc) + 'px'; cv.style.height = (H * sc) + 'px';

            const bw = Math.min(W - bx, Math.ceil(cw + fsR * 0.6 + 2 * pad * u)), bh = Math.min(H - by, Math.ceil(asc + desc + 2 * pad * u));

  startFlames() {
    const B = [0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21].map((v) => (v + 0.5) / 64);
    const hash = (x, y) => { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); };
    const vnoise = (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);

      const P = this.props;
      const bg = P.corFundo ?? '#000000', dith = P.corDither ?? '#4B3161', lite = P.corCursor ?? '#A57FD0';
      const pal = [mixHex(bg, dith, 0.55), dith, mixHex(dith, lite, 0.5), lite, mixHex(lite, '#FFFFFF', 0.82)];
      const emPal = [pal[1], pal[2], lite, P.corDestaque ?? '#B48CFF', mixHex(lite, '#FFFFFF', 0.6), '#FFFFFF', mixHex(P.corDestaque ?? '#B48CFF', '#FF9AD5', 0.45)];

        let I = this.flameI[id] || 0;
        I += (target - I) * (target ? 0.09 : 0.06);
        const sm = this.smoke[id] || (this.smoke[id] = { puffs: [], parts: [], acc: 0 });

        const cell = vertical ? cell0 : Math.max(2, Math.round(Number(P.tamanhoPixel ?? 3)));

            life: 0, max: 1.4 + Math.random() * 2, ph: Math.random() * 6.28,

  startReveal() {
    const keys = ['games', 'art', 'about', 'contact', 'footer'];
    this.revealKeys = keys;
    const check = () => {
      const vh = window.innerHeight || 800;
      const hit = keys.filter((k) => {
        const el = this.els[k];
        if (!el) return false;
        const r = el.getBoundingClientRect();
        return r.top < vh * 0.88 && r.bottom > 0;
      });
      if (hit.length) this.reveal(hit);
    };
    this.onScroll = check;
    window.addEventListener('scroll', check, { passive: true });
    window.addEventListener('resize', check);

      this.rio = new IntersectionObserver((entries) => {
        const hit = [];
        entries.forEach((en) => { if (en.isIntersecting && en.target.dataset.revealKey) hit.push(en.target.dataset.revealKey); });
        if (hit.length) this.reveal(hit);
      }, { threshold: 0.08 });
      keys.forEach((k) => { if (this.els[k]) this.rio.observe(this.els[k]); });
    }
    requestAnimationFrame(check);
  }

    const U = {};

    const reduce = !!(this.props.respeitarMovimentoReduzido && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    const uRipLoc = gl.getUniformLocation(prog, 'uRip');
    const ripBuf = new Float32Array(48);
    if ('IntersectionObserver' in window) {
      this.io = new IntersectionObserver((es) => { this.visible = es[0].isIntersecting; });
      this.io.observe(cv);
    }

    let last = performance.now();
    const frame = (now) => {
      if (this.dead) return;
      this.raf = requestAnimationFrame(frame);
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (!this.visible) return;
      const c = this.cfg();
      if (!reduce) this.t += dt * c.speed;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(1, Math.floor(cv.clientWidth * dpr));
      const h = Math.max(1, Math.floor(cv.clientHeight * dpr));
      if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
      gl.viewport(0, 0, w, h);
      if (this.mouse[0] > -9000) {
        this.sm[0] = this.mouse[0];
        this.sm[1] = this.mouse[1];
      }
      gl.uniform2f(U.uRes, w, h);
      gl.uniform1f(U.uTime, this.t);
      gl.uniform3fv(U.uA, c.a);
      gl.uniform3fv(U.uB, c.b);
      gl.uniform1f(U.uPx, Math.max(1, c.px * dpr));
      gl.uniform1f(U.uScale, c.scale);
      gl.uniform1f(U.uContrast, c.contrast);
      gl.uniform1f(U.uBias, c.bias);
      gl.uniform2f(U.uMouse, this.sm[0] * dpr, h - this.sm[1] * dpr);
      gl.uniform1f(U.uMode, c.mode);
      gl.uniform1f(U.uMouseOn, c.mouseOn);
      gl.uniform3fv(U.uC, c.c);
      gl.uniform1f(U.uGR, Math.max(0.01, c.gr));
      for (let i = 0; i < 16; i++) {
        const rp = this.rip[i];
        if (rp) { ripBuf[i * 3] = rp[0] * dpr; ripBuf[i * 3 + 1] = h - rp[1] * dpr; ripBuf[i * 3 + 2] = rp[2]; }
        else { ripBuf[i * 3] = 0; ripBuf[i * 3 + 1] = 0; ripBuf[i * 3 + 2] = -100; }
      }
      gl.uniform3fv(uRipLoc, ripBuf);
      gl.uniform1f(U.uNow, (now - this.t0) / 1000);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    };
    this.raf = requestAnimationFrame(frame);
  }

  renderVals() {
    const P = this.props;

        desc: 'A team-made sci-fi horror escape room inspired by the Alien films. [Add 1-2 sentences about the main puzzle.]',
        role: '[Your role on the team]', status: 'Released', media: '[1-minute trailer]', href: itch, linkLabel: '[Project link]' },
      { id: 'vessels', title: 'Vessels Of Sins', kind: 'Roguelite / Dark Fantasy', year: '2026', tags: [],
        desc: '[1-2 sentences about Vessels Of Sins: the run structure, the world and its dark fantasy tone.]',
        role: '[Your role]', status: 'Released', media: '[Gameplay GIF - a run]', href: itch, linkLabel: '[Project link]' },
      { id: 'brick', title: 'Brick Royale', kind: 'VR / Motion Capture', year: '2026', tags: [],
        desc: 'VR boxing inside a motion capture studio: the player wears a headset and real gloves and fights an opponent tied to a physical punching dummy, in an arena full of neon lights and ad screens.',
        role: '[Your role on the team]', status: 'Released', media: '[Showreel - people playing]', href: itch, linkLabel: '[Watch showreel]' },
      { id: 'liminal', title: 'Project: Liminal Fog', kind: 'First-Person / Survival Horror', year: '2027', tags: [],
        desc: '[1-2 sentences about Liminal Fog: the place, the threat and the feeling you want the player to have.]',

    ];
    const projects = data.map((d, i) => {
      const open = S.open === d.id;
      return Object.assign({}, d, {

    const as = 'https://www.artstation.com/kr1pt1cs';
    const artAll = [
      { title: 'Ogre - front view', cat: 'Concept', meta: 'Pencil, color and shading in Photoshop', ph: '[Ogre image]', href: as },

      { title: '[3D model]', cat: '3D', meta: 'Blender / [year]', ph: '[Render or rotating .glb model]', href: as },

      { title: '[3D model]', cat: '3D', meta: 'Blender / [year]', ph: '[Wireframe + render]', href: as }
    ];
    const filter = S.filter || 'All';
    const art = artAll
      .filter((a) => filter === 'All' || a.cat === filter)
      .map((a, i) => Object.assign({}, a, { delay: (0.5 + i * 0.14).toFixed(2) + 's' }));
    const filters = ['All', 'Concept', '3D'].map((f) => ({
      label: f,

    return {

      navGames: this.navHandlers.games,
      navArt: this.navHandlers.art,

      setAboutFx: this.setAboutFx,
      setContactFx: this.setContactFx,
      onMove: this.onMove,
      onLeave: this.onLeave,
      refGames: this.refFor('games'),

      refContact: this.refFor('contact'),
      refFooter: this.refFor('footer'),
      maskGames: this.maskFor('games'),
      maskArt: this.maskFor('art'),
      maskAbout: this.maskFor('about'),
      maskContact: this.maskFor('contact'),
      maskFooter: this.maskFor('footer'),
      clsGames: cls('games'),

      clsFooter: cls('footer'),
      projects: projects,

  }
